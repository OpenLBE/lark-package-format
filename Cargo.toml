[package]
name = "lark-package-format"
version = "1.0.1"
edition = "2024"
description = "Pack, unpack, and validate Lightweight Android Resource Kit (.lark) packages"
license = "MIT"
repository = "https://github.com/OpenLBE/lark-package-format"

[[bin]]
name = "lark-pack-tool"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
apk-info-axml = "1.0.11"
chrono = { version = "0.4.44", default-features = false, features = ["clock"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
walkdir = "2.5.0"
zip = { version = "6.0.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.release]
codegen-units = 1
lto = true
strip = true

[build-dependencies]
winresource = "0.1.31"
